<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MadPlan</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080b12;
            --surface: #0e1220;
            --card: #111827;
            --border: #1e2a40;
            --accent: #38bdf8;
            --accent2: #818cf8;
            --text: #e2e8f0;
            --muted: #64748b;
            --soft: #94a3b8;
            --danger: #f87171;
            --warn: #fbbf24;
            --success: #34d399;
        }

        body {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.2;
            pointer-events: none;
            z-index: -1;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(8, 11, 18, 0.85);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        h1 span { color: var(--accent); }

        h2 {
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        h2 small { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--soft); font-weight: 400; }

        main {
            display: grid;
            grid-template-columns: minmax(320px, 420px) 1fr;
            gap: 20px;
            padding: 20px 24px 48px;
            max-width: 1500px;
            margin: 0 auto;
        }
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; padding: 16px; }
            header { padding: 14px 16px; }
        }

        .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        input[type=text], select {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 12px;
            font: inherit;
        }
        input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); }
        header select { width: auto; }

        button {
            font: inherit;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            padding: 7px 12px;
        }
        button:hover { border-color: var(--accent); }
        button.primary {
            background: var(--accent);
            color: #04121c;
            border: none;
            font-weight: 500;
            padding: 12px;
            width: 100%;
            font-size: 14px;
        }
        button.primary:disabled { opacity: 0.5; cursor: wait; }
        button.small { padding: 4px 9px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
        button.danger:hover { border-color: var(--danger); color: var(--danger); }

        .muted { color: var(--soft); }
        .tiny { font-size: 11px; }
        .hint { color: var(--muted); font-size: 12px; padding: 8px 0; }

        /* Search results */
        #results { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
        .result {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            background: var(--surface);
        }
        .result-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
        .result-name { font-weight: 500; }
        .result-title { color: var(--soft); }
        .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .tag {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 99px;
            border: 1px solid var(--border);
            color: var(--soft);
        }
        .gpa { font-weight: 500; border-color: currentColor; }
        .gpa.easy { color: var(--success); }
        .gpa.mid  { color: var(--warn); }
        .gpa.hard { color: var(--danger); }
        details { margin-top: 8px; color: var(--soft); font-size: 12px; line-height: 1.5; }
        summary { cursor: pointer; color: var(--muted); }
        details p { margin-top: 6px; }

        /* My courses */
        .mine { display: flex; flex-direction: column; gap: 6px; }
        .mine-row {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; border-radius: 8px; background: var(--surface);
        }
        .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .mine-row .grow { flex: 1; min-width: 0; }
        .mine-row .grow div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Preferences */
        .prefs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .prefs label.field { display: flex; flex-direction: column; gap: 5px; color: var(--soft); font-size: 12px; }
        .full { grid-column: 1 / -1; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip input { display: none; }
        .chip span {
            display: inline-block; padding: 6px 11px; border-radius: 99px;
            border: 1px solid var(--border); cursor: pointer; color: var(--soft);
        }
        .chip input:checked + span { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }
        .check { display: flex; align-items: center; gap: 8px; color: var(--soft); cursor: pointer; }
        .busy-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
        .busy-row select { width: auto; padding: 6px 8px; }

        /* Plans */
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .tab {
            flex: 1; min-width: 140px; text-align: left; padding: 10px 12px;
        }
        .tab.active { border-color: var(--accent); background: rgba(56,189,248,0.08); }
        .tab .score { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
        .notes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .alert {
            padding: 10px 12px; border-radius: 8px; margin-bottom: 12px;
            border: 1px solid rgba(251,191,36,0.4); color: var(--warn); background: rgba(251,191,36,0.06);
        }
        .alert.bad { border-color: rgba(248,113,113,0.4); color: var(--danger); background: rgba(248,113,113,0.06); }

        /* Calendar */
        .calendar { display: grid; grid-template-columns: 44px repeat(5, 1fr); position: relative; overflow-x: auto; }
        .cal-head { text-align: center; color: var(--soft); padding-bottom: 6px; font-size: 12px; }
        .cal-times { position: relative; }
        .cal-time { position: absolute; right: 6px; font-size: 10px; color: var(--muted); transform: translateY(-50%); }
        .cal-day { position: relative; border-left: 1px solid var(--border); min-width: 70px; }
        .cal-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); opacity: 0.5; }
        .block {
            position: absolute; left: 3px; right: 3px; border-radius: 6px;
            padding: 3px 5px; font-size: 10.5px; line-height: 1.25; overflow: hidden;
            color: #04121c;
        }
        .block b { font-weight: 500; display: block; }
        .block.discussion, .block.lab, .block.seminar { opacity: 0.8; border: 1px dashed rgba(0,0,0,0.4); }
        .block.busy { background: repeating-linear-gradient(45deg, #1e2a40, #1e2a40 6px, #111827 6px, #111827 12px); color: var(--soft); }

        /* Section table */
        .table-wrap { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; color: var(--muted); font-weight: 400; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
        .status-OPEN { color: var(--success); }
        .status-WAITLISTED { color: var(--warn); }
        .status-CLOSED { color: var(--danger); }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

        .empty { text-align: center; padding: 48px 16px; color: var(--soft); line-height: 1.7; }
        .empty b { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--text); display: block; margin-bottom: 6px; }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<header>
    <h1>UW <span>Schedules</span></h1>
    <select id="term" aria-label="Term"></select>
</header>

<main>
    <div class="col">
        <section class="card">
            <h2>Find courses <small>search by name, number or topic</small></h2>
            <input type="text" id="search" placeholder="e.g. COMP SCI 400, psychology, ECON 101" autocomplete="off">
            {% if not grades_enabled %}
            <p class="hint">Grade stats are off — add MADGRADES_TOKEN to .env to turn them on.</p>
            {% endif %}
            <div id="results"></div>
        </section>

        <section class="card">
            <h2>My courses <small id="credit-total"></small></h2>
            <div class="mine" id="mine"></div>
        </section>

        <section class="card">
            <h2>Preferences</h2>
            <div class="prefs">
                <label class="field">Start no earlier than
                    <select id="pref-start"></select>
                </label>
                <label class="field">End no later than
                    <select id="pref-end"></select>
                </label>
                <div class="field full">
                    <label class="field">Days I'd like off</label>
                    <div class="chips" id="pref-days"></div>
                </div>
                <div class="field full">
                    <label class="field">Spacing</label>
                    <div class="chips" id="pref-spacing">
                        <label class="chip"><input type="radio" name="spacing" value="compact"><span>Compact</span></label>
                        <label class="chip"><input type="radio" name="spacing" value="balanced" checked><span>Balanced</span></label>
                        <label class="chip"><input type="radio" name="spacing" value="spread"><span>Breathing room</span></label>
                    </div>
                </div>
                <label class="check full"><input type="checkbox" id="pref-waitlist" checked> Avoid waitlisted sections</label>
                <label class="check full"><input type="checkbox" id="pref-closed"> Include full sections</label>
                <div class="full">
                    <label class="field">Busy times <span class="tiny muted">(work, practice, ...)</span></label>
                    <div id="busy"></div>
                    <button class="small" id="add-busy" style="margin-top:8px">+ Add busy time</button>
                </div>
            </div>
        </section>

        <button class="primary" id="generate">Build my schedule</button>
    </div>

    <div class="col">
        <section class="card" id="output">
            <div class="empty">
                <b>No schedule yet</b>
                Search for courses, add them, set your preferences,<br>then hit “Build my schedule”.
            </div>
        </section>
    </div>
</main>

<script>
const DAYS     = ["Mon", "Tue", "Wed", "Thu", "Fri"];
const COLORS   = ["#38bdf8", "#a78bfa", "#34d399", "#fbbf24", "#f472b6", "#fb923c", "#2dd4bf", "#c084fc"];
const ICS_DAYS = { Mon: "MO", Tue: "TU", Wed: "WE", Thu: "TH", Fri: "FR", Sat: "SA", Sun: "SU" };

const state = {
    term: null,
    terms: [],
    mine: [],      // course summaries the student added
    busy: [],      // [{days: [...], start: 1200, end: 1300}]
    plans: [],
    activePlan: 0,
    lastResult: null,
};

// ── Helpers ─────────────────────────────────────────────────

const $ = (sel) => document.querySelector(sel);

function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtTime(t) {
    let h = Math.floor(t / 100), m = t % 100;
    const ampm = h < 12 ? "am" : "pm";
    h = h % 12 || 12;
    return m ? `${h}:${String(m).padStart(2, "0")}${ampm}` : `${h}${ampm}`;
}

const toMin = (t) => Math.floor(t / 100) * 60 + t % 100;

function gpaClass(gpa) {
    return gpa >= 3.5 ? "easy" : gpa >= 3.0 ? "mid" : "hard";
}

function gpaTag(stats, label = "avg GPA") {
    if (!stats) return "";
    return `<span class="tag gpa ${gpaClass(stats.gpa)}" title="${stats.graded.toLocaleString()} grades">${stats.gpa.toFixed(2)} ${label} · ${stats.pct_a}% A</span>`;
}

function colorFor(name) {
    const i = state.mine.findIndex(c => c.name === name);
    return COLORS[(i < 0 ? 0 : i) % COLORS.length];
}

function save() {
    try {
        localStorage.setItem("madplan", JSON.stringify({
            term: state.term, mine: state.mine, busy: state.busy, prefs: readPrefs(),
        }));
    } catch (e) { /* storage unavailable — fine, just won't persist */ }
}

function load() {
    try { return JSON.parse(localStorage.getItem("madplan")) || {}; }
    catch (e) { return {}; }
}

// ── Terms ───────────────────────────────────────────────────

async function initTerms(saved) {
    const res = await fetch("/api/terms").then(r => r.json());
    state.terms = res.terms;
    state.term = res.terms.some(t => t.code === saved.term) ? saved.term : res.default;
    $("#term").innerHTML = res.terms.map(t =>
        `<option value="${t.code}" ${t.code === state.term ? "selected" : ""}>${esc(t.name)}</option>`).join("");
}

$("#term").addEventListener("change", (e) => {
    state.term = e.target.value;
    // Course ids are per term, so the old list may not apply
    if (state.mine.length && !confirm("Switching terms clears your course list. Continue?")) {
        e.target.value = state.mine[0].term;
        state.term = e.target.value;
        return;
    }
    state.mine = [];
    renderMine();
    runSearch();
    save();
});

// ── Search ──────────────────────────────────────────────────

let searchTimer, searchSeq = 0;

$("#search").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 350);
});

async function runSearch() {
    const q = $("#search").value.trim();
    const box = $("#results");
    if (!q) { box.innerHTML = ""; return; }

    const seq = ++searchSeq;
    box.innerHTML = `<p class="hint"><span class="spinner"></span> Searching…</p>`;
    let res;
    try {
        res = await fetch(`/api/search?term=${state.term}&q=${encodeURIComponent(q)}`).then(r => r.json());
    } catch (e) {
        if (seq === searchSeq) box.innerHTML = `<p class="hint">Search failed — is the UW API reachable?</p>`;
        return;
    }
    if (seq !== searchSeq) return;   // a newer search already started

    if (!res.courses.length) {
        box.innerHTML = `<p class="hint">No courses found for “${esc(q)}”.</p>`;
        return;
    }
    box.innerHTML = `<p class="hint">${res.found.toLocaleString()} result${res.found === 1 ? "" : "s"}${res.found > 20 ? " — showing top 20" : ""}</p>` +
        res.courses.map(courseCard).join("");
    box.querySelectorAll("[data-add]").forEach(btn => btn.addEventListener("click", () => {
        addCourse(res.courses[+btn.dataset.add]);
        btn.textContent = "Added";
        btn.disabled = true;
    }));
}

function courseCard(c, i) {
    const added = state.mine.some(m => m.name === c.name);
    const g = c.grades && (c.grades.recent || c.grades.overall);
    const tags = [
        gpaTag(g),
        `<span class="tag">${esc(c.credits)} cr</span>`,
        ...c.breadths.map(b => `<span class="tag">${esc(b)}</span>`),
        c.gen_ed ? `<span class="tag">${esc(c.gen_ed)}</span>` : "",
        c.ethnic_studies ? `<span class="tag">Ethnic Studies</span>` : "",
        ...c.levels.map(l => `<span class="tag">${esc(l)}</span>`),
    ].join("");
    return `
        <div class="result">
            <div class="result-top">
                <div>
                    <div class="result-name">${esc(c.name)}</div>
                    <div class="result-title">${esc(c.title)}</div>
                </div>
                <button class="small" data-add="${i}" ${added ? "disabled" : ""}>${added ? "Added" : "+ Add"}</button>
            </div>
            <div class="tags">${tags}</div>
            <details>
                <summary>Details</summary>
                <p>${esc(c.description)}</p>
                ${c.prerequisites ? `<p><b>Prereqs:</b> ${esc(c.prerequisites)}</p>` : ""}
                ${c.typically_offered ? `<p><b>Typically offered:</b> ${esc(c.typically_offered)}</p>` : ""}
            </details>
        </div>`;
}

// ── My courses ──────────────────────────────────────────────

function addCourse(c) {
    if (state.mine.some(m => m.name === c.name)) return;
    state.mine.push({ ...c, term: state.term });
    renderMine();
    save();
}

function renderMine() {
    const box = $("#mine");
    if (!state.mine.length) {
        box.innerHTML = `<p class="hint">Nothing added yet.</p>`;
        $("#credit-total").textContent = "";
        return;
    }
    const credits = state.mine.reduce((sum, c) => sum + (c.min_credits || 0), 0);
    $("#credit-total").innerHTML = `${credits} credits${credits > 18 ? ` <span style="color:var(--danger)">· over 18</span>` : ""}`;
    box.innerHTML = state.mine.map((c, i) => {
        const g = c.grades && (c.grades.recent || c.grades.overall);
        return `
            <div class="mine-row">
                <span class="swatch" style="background:${COLORS[i % COLORS.length]}"></span>
                <div class="grow">
                    <div>${esc(c.name)} <span class="muted">· ${esc(c.credits)} cr</span></div>
                    <div class="tiny muted">${esc(c.title)}</div>
                </div>
                ${g ? `<span class="tag gpa ${gpaClass(g.gpa)}">${g.gpa.toFixed(2)}</span>` : ""}
                <button class="small danger" data-remove="${i}" aria-label="Remove">✕</button>
            </div>`;
    }).join("");
    box.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", () => {
        state.mine.splice(+btn.dataset.remove, 1);
        renderMine();
        save();
    }));
}

// ── Preferences ─────────────────────────────────────────────

function timeOptions(from, to, step = 30) {
    const opts = [];
    for (let m = toMin(from); m <= toMin(to); m += step) {
        const t = Math.floor(m / 60) * 100 + m % 60;
        opts.push(`<option value="${t}">${fmtTime(t)}</option>`);
    }
    return opts.join("");
}

function initPrefs(saved) {
    const p = saved.prefs || {};
    $("#pref-start").innerHTML = timeOptions(700, 1200);
    $("#pref-end").innerHTML = timeOptions(1400, 2100);
    $("#pref-start").value = p.earliest_start || 900;
    $("#pref-end").value = p.latest_end || 1700;
    $("#pref-days").innerHTML = DAYS.map(d =>
        `<label class="chip"><input type="checkbox" value="${d}" ${(p.days_off || []).includes(d) ? "checked" : ""}><span>${d}</span></label>`).join("");
    if (p.spacing) document.querySelector(`input[name=spacing][value=${p.spacing}]`).checked = true;
    if (p.avoid_waitlist === false) $("#pref-waitlist").checked = false;
    if (p.include_closed) $("#pref-closed").checked = true;

    state.busy = saved.busy || [];
    renderBusy();

    document.querySelectorAll(".prefs input, .prefs select").forEach(el => el.addEventListener("change", save));
}

function readPrefs() {
    return {
        earliest_start: +$("#pref-start").value,
        latest_end:     +$("#pref-end").value,
        days_off:       [...document.querySelectorAll("#pref-days input:checked")].map(i => i.value),
        spacing:        document.querySelector("input[name=spacing]:checked").value,
        avoid_waitlist: $("#pref-waitlist").checked,
        include_closed: $("#pref-closed").checked,
    };
}

function renderBusy() {
    $("#busy").innerHTML = state.busy.map((b, i) => `
        <div class="busy-row" data-i="${i}">
            ${DAYS.map(d => `<label class="chip"><input type="checkbox" value="${d}" ${b.days.includes(d) ? "checked" : ""}><span>${d[0]}${d === "Thu" ? "h" : ""}</span></label>`).join("")}
            <select data-k="start">${timeOptions(700, 2200)}</select>
            <span class="muted">–</span>
            <select data-k="end">${timeOptions(730, 2300)}</select>
            <button class="small danger" data-remove-busy="${i}" aria-label="Remove">✕</button>
        </div>`).join("");

    document.querySelectorAll(".busy-row").forEach(row => {
        const b = state.busy[+row.dataset.i];
        row.querySelector("[data-k=start]").value = b.start;
        row.querySelector("[data-k=end]").value = b.end;
        row.addEventListener("change", () => {
            b.days  = [...row.querySelectorAll("input:checked")].map(i => i.value);
            b.start = +row.querySelector("[data-k=start]").value;
            b.end   = +row.querySelector("[data-k=end]").value;
            save();
        });
    });
    document.querySelectorAll("[data-remove-busy]").forEach(btn => btn.addEventListener("click", () => {
        state.busy.splice(+btn.dataset.removeBusy, 1);
        renderBusy();
        save();
    }));
}

$("#add-busy").addEventListener("click", () => {
    state.busy.push({ days: [], start: 1200, end: 1300 });
    renderBusy();
    save();
});

// ── Build schedules ─────────────────────────────────────────

$("#generate").addEventListener("click", async () => {
    const out = $("#output");
    if (!state.mine.length) {
        out.innerHTML = `<div class="empty"><b>Add some courses first</b>Search on the left and hit “+ Add”.</div>`;
        return;
    }
    const btn = $("#generate");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Building…`;
    out.innerHTML = `<div class="empty"><span class="spinner"></span> Pulling live sections and seat counts…</div>`;

    const prefs = readPrefs();
    try {
        const res = await fetch("/api/schedules", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                term: state.term,
                courses: state.mine,
                prefs,
                include_closed: prefs.include_closed,
                blocked: state.busy,
            }),
        }).then(r => r.json());
        state.lastResult = res;
        state.plans = res.plans || [];
        state.activePlan = 0;
        renderOutput();
        if (window.innerWidth <= 900) out.scrollIntoView({ behavior: "smooth" });
    } catch (e) {
        out.innerHTML = `<div class="empty"><b>Something went wrong</b>Couldn't reach the server or the UW API. Try again in a moment.</div>`;
    } finally {
        btn.disabled = false;
        btn.textContent = "Build my schedule";
    }
});

function renderOutput() {
    const res = state.lastResult;
    const out = $("#output");

    if (res.error) {
        out.innerHTML = `<div class="empty"><b>Hmm</b>${esc(res.error)}</div>`;
        return;
    }

    let alerts = "";
    if (res.unschedulable.length) {
        alerts += `<div class="alert bad">No open section fits for: <b>${res.unschedulable.map(esc).join(", ")}</b>. Try “Include full sections”, or remove a busy time.</div>`;
    }
    if (res.online.length) {
        alerts += `<div class="alert">Online / no set meeting time: <b>${res.online.map(esc).join(", ")}</b> — not shown on the calendar.</div>`;
    }

    if (!state.plans.length) {
        out.innerHTML = alerts + `<div class="empty"><b>No conflict-free schedule</b>These courses can't all fit together. Try removing one, or allow full sections.</div>`;
        return;
    }

    const plan = state.plans[state.activePlan];
    const tabs = state.plans.map((p, i) => `
        <button class="tab ${i === state.activePlan ? "active" : ""}" data-plan="${i}">
            <div class="tiny muted">Plan ${"ABC"[i]}${i ? " · backup" : ""}</div>
            <div class="score">${p.score}<span class="tiny muted"> / 100</span></div>
            <div class="tiny muted">${p.credits} credits</div>
        </button>`).join("");

    const notes = plan.notes.map(n => `<span class="tag">${esc(n)}</span>`).join("");
    const walks = plan.tight_walks.map(w =>
        `<div class="alert">${esc(w.day)}: ${esc(w.from)} → ${esc(w.to)} is a ~${w.walk} min walk with ${w.gap} min between.</div>`).join("");

    out.innerHTML = `
        <h2>Your schedule <small>${res.total >= 5000 ? "5000+" : res.total.toLocaleString()} possible combinations checked</small></h2>
        ${alerts}
        <div class="tabs">${tabs}</div>
        ${notes ? `<div class="notes">${notes}</div>` : ""}
        ${walks}
        ${calendar(plan)}
        ${sectionTable(plan)}
        <div class="actions">
            <button id="copy-numbers">Copy class numbers</button>
            <button id="download-ics">Add to calendar (.ics)</button>
        </div>`;

    out.querySelectorAll("[data-plan]").forEach(btn => btn.addEventListener("click", () => {
        state.activePlan = +btn.dataset.plan;
        renderOutput();
    }));
    $("#copy-numbers").addEventListener("click", copyNumbers);
    $("#download-ics").addEventListener("click", downloadIcs);
}

function calendar(plan) {
    const busyBlocks = state.busy.filter(b => b.days.length).map(b => ({
        name: "Busy", type: "busy", days: b.days, start: b.start, end: b.end, section: "",
    }));
    const items = [...plan.sections, ...busyBlocks];

    const startHour = Math.min(8, ...items.map(s => Math.floor(s.start / 100)));
    const endHour   = Math.max(17, ...items.map(s => Math.ceil(toMin(s.end) / 60)));
    const pxPerMin  = 0.9;
    const height    = (endHour - startHour) * 60 * pxPerMin;
    const top       = (t) => (toMin(t) - startHour * 60) * pxPerMin;

    let times = "", lines = "";
    for (let h = startHour; h <= endHour; h++) {
        const y = (h - startHour) * 60 * pxPerMin;
        times += `<div class="cal-time" style="top:${y}px">${fmtTime(h * 100)}</div>`;
        lines += `<div class="cal-line" style="top:${y}px"></div>`;
    }

    const cols = DAYS.map(day => {
        const blocks = items.filter(s => s.days.includes(day)).map(s => {
            const style = s.type === "busy" ? "" : `background:${colorFor(s.name)}`;
            const label = s.type === "busy" ? "Busy" : `${esc(s.name)}`;
            const sub   = s.type === "busy" ? "" : `${s.type.slice(0, 3).toUpperCase()} ${esc(s.section)}${s.building ? " · " + esc(s.building) : ""}`;
            return `<div class="block ${s.type}" style="top:${top(s.start)}px;height:${(toMin(s.end) - toMin(s.start)) * pxPerMin}px;${style}"
                        title="${label} ${sub} ${fmtTime(s.start)}–${fmtTime(s.end)}">
                        <b>${label}</b>${sub}<br>${fmtTime(s.start)}–${fmtTime(s.end)}
                    </div>`;
        }).join("");
        return `<div class="cal-day" style="height:${height}px">${lines}${blocks}</div>`;
    }).join("");

    return `
        <div class="calendar">
            <div></div>${DAYS.map(d => `<div class="cal-head">${d}</div>`).join("")}
            <div class="cal-times" style="height:${height}px">${times}</div>${cols}
        </div>`;
}

function sectionTable(plan) {
    const rows = plan.sections.map(s => {
        const inst = s.instructors.map(i =>
            `${esc(i.name)}${i.grades ? ` <span class="tag gpa ${gpaClass(i.grades.gpa)}">${i.grades.gpa.toFixed(2)}</span>` : ""}`).join("<br>") || `<span class="muted">TBA</span>`;
        const seats = s.status
            ? `<span class="status-${s.status}">${s.status === "OPEN" ? `${s.open_seats ?? "?"} open` : s.status.toLowerCase()}</span>${s.waitlist ? `<br><span class="tiny muted">${s.waitlist} on waitlist</span>` : ""}`
            : "";
        return `
            <tr>
                <td><span class="swatch" style="display:inline-block;background:${colorFor(s.name)}"></span> ${esc(s.name)}</td>
                <td>${s.type.slice(0, 3).toUpperCase()} ${esc(s.section)}</td>
                <td>${s.days.join("/")}<br><span class="muted">${fmtTime(s.start)}–${fmtTime(s.end)}</span></td>
                <td>${esc(s.building || "—")}${s.room ? `<br><span class="muted">Rm ${esc(s.room)}</span>` : ""}</td>
                <td>${inst}</td>
                <td>${seats}</td>
                <td>${s.class_number ?? ""}</td>
            </tr>`;
    }).join("");
    return `
        <div class="table-wrap">
            <table>
                <thead><tr><th>Course</th><th>Section</th><th>When</th><th>Where</th><th>Instructor</th><th>Seats</th><th>Class #</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

// ── Export ──────────────────────────────────────────────────

function copyNumbers() {
    const plan = state.plans[state.activePlan];
    const byCourse = {};
    for (const s of plan.sections) {
        if (s.class_number) (byCourse[s.name] ||= new Set()).add(`${s.type.slice(0, 3).toUpperCase()} ${s.section} (#${s.class_number})`);
    }
    const text = Object.entries(byCourse).map(([name, secs]) => `${name}: ${[...secs].join(", ")}`).join("\n");
    navigator.clipboard.writeText(text).then(() => {
        $("#copy-numbers").textContent = "Copied!";
        setTimeout(() => { const b = $("#copy-numbers"); if (b) b.textContent = "Copy class numbers"; }, 1500);
    });
}

function downloadIcs() {
    const plan = state.plans[state.activePlan];
    const term = state.terms.find(t => t.code === state.term);
    const pad  = (n) => String(n).padStart(2, "0");
    const ymd  = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    const hm   = (t) => `${pad(Math.floor(t / 100))}${pad(t % 100)}00`;
    const dayIdx = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };

    const start = new Date(term.start + "T00:00:00");
    // UNTIL must be UTC; 05:59Z the day after the last class day = end of that day in Madison
    const last  = new Date(term.end + "T00:00:00");
    last.setDate(last.getDate() + 1);
    const until = ymd(last) + "T055959Z";

    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MadPlan//EN", "CALSCALE:GREGORIAN"];
    plan.sections.forEach((s, i) => {
        // First meeting = first date on/after term start that falls on one of the section's days
        const first = new Date(start);
        while (!s.days.some(d => dayIdx[d] === first.getDay())) first.setDate(first.getDate() + 1);
        lines.push(
            "BEGIN:VEVENT",
            `UID:${state.term}-${s.class_number || i}-${i}@madplan`,
            `SUMMARY:${s.name} ${s.type.slice(0, 3).toUpperCase()} ${s.section}`,
            `LOCATION:${[s.building, s.room && "Rm " + s.room].filter(Boolean).join(" ")}`,
            `DTSTART;TZID=America/Chicago:${ymd(first)}T${hm(s.start)}`,
            `DTEND;TZID=America/Chicago:${ymd(first)}T${hm(s.end)}`,
            `RRULE:FREQ=WEEKLY;BYDAY=${s.days.map(d => ICS_DAYS[d]).join(",")};UNTIL=${until}`,
            "END:VEVENT",
        );
    });
    lines.push("END:VCALENDAR");

    const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${term.name.replace(" ", "-")}-schedule.ics`;
    a.click();
    URL.revokeObjectURL(a.href);
}

// ── Boot ────────────────────────────────────────────────────

(async () => {
    const saved = load();
    state.mine = saved.mine || [];
    initPrefs(saved);
    renderMine();
    try {
        await initTerms(saved);
    } catch (e) {
        $("#output").innerHTML = `<div class="empty"><b>Can't reach UW's course API</b>Check your connection and reload.</div>`;
    }
})();
</script>
